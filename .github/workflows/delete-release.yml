name: Delete release (maintenance)

# 维护用：推一个 cleanup-<标签名> 的标签，就会删掉 GitHub 上对应的 Release（以及它的附件）。
# 例：git tag cleanup-v0.8.4-ci.5 && git push origin cleanup-v0.8.4-ci.5
on:
  push:
    tags: ['cleanup-*']

permissions:
  contents: write

jobs:
  delete:
    name: Delete release
    runs-on: ubuntu-latest
    steps:
      - name: Delete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          target="${TAG#cleanup-}"
          echo "要删除的 Release：$target"
          gh release delete "$target" --yes --repo "$GITHUB_REPOSITORY"
          echo "已删除 Release：$target"
          # Release 删掉后，顺手把对应的标签也删掉（标签不存在就跳过）
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --tags "$remote" "refs/tags/$target" >/dev/null 2>&1; then
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ":refs/tags/$target"
            echo "已删除标签：$target"
          else
            echo "标签 $target 已经不存在，跳过"
          fi
